# Site settings
title: Girija Swain
subtitle: Principal / Lead Engineer
email: contact@gsswain.com
description: >-
  16+ years of experience leading digital transformation across banking and insurance,
  modernising legacy systems into low-latency, cloud-native platforms. Specialising in
  GCP & AWS architectures, event-driven microservices, AI-assisted engineering, and
  scaling high-performing teams.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://gsswain.com" # the base hostname & protocol for your site
github_username: gsswain
linkedin_username: gsswain
stackoverflow_id: 4601120
logo: /assets/images/avatar.jpeg
author:
  name: Girija Swain
  url: https://gsswain.com
social:
  name: Girija Swain
  links:
    - https://www.linkedin.com/in/gsswain
    - https://github.com/GSSwain
    - https://stackoverflow.com/users/4601120/gsswain

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-gist


# Google Analytics
google_analytics: G-NK9JKFXRK7

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md

# Navigation
navigation:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Case Studies
    url: /case-studies/
  - title: Blog
    url: /blog/
  - title: Contact
    url: /contact/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/avatar.jpeg
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Girija Swain"

# Pagination
paginate: 5
paginate_path: "/blog/page:num/"