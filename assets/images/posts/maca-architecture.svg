<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" role="img" aria-label="MACA high-level architecture diagram">
  <rect width="980" height="460" fill="#0b1220"/>
  <text x="490" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#e5eefb">MACA at a glance: route, plan, build, verify, promote</text>

  <!-- Row 1: Request -> Complexity Router -->
  <rect x="60" y="84" width="210" height="72" rx="16" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
  <text x="165" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#bfdbfe">User Request</text>

  <rect x="340" y="84" width="260" height="72" rx="16" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
  <text x="470" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#fde68a">Complexity Router</text>
  <text x="470" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fde68a">Simple · Medium · Complex (with fallbacks)</text>

  <!-- Row 2: 3 Model Tiers -->
  <rect x="60" y="206" width="190" height="76" rx="14" fill="#111827" stroke="#34d399" stroke-width="2"/>
  <text x="155" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#d1fae5">Local Gemma</text>
  <text x="155" y="261" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#d1fae5">Simple (Ollama · free)</text>

  <rect x="280" y="206" width="190" height="76" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
  <text x="375" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e0f2fe">Google Gemini</text>
  <text x="375" y="261" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e0f2fe">Medium complexity</text>

  <rect x="500" y="206" width="190" height="76" rx="14" fill="#111827" stroke="#fb7185" stroke-width="2"/>
  <text x="595" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fecdd3">Anthropic Claude</text>
  <text x="595" y="261" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fecdd3">Complex reasoning</text>

  <!-- Right column: Multi-Agent Pipeline & Clean Workspace -->
  <rect x="730" y="130" width="210" height="170" rx="18" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
  <text x="835" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ddd6fe">Multi-Agent Pipeline</text>
  <text x="835" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ddd6fe">1. Clarify &amp; Plan</text>
  <text x="835" y="224" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ddd6fe">2. Spec &amp; Human Approval</text>
  <text x="835" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ddd6fe">3. Code in Staging</text>
  <text x="835" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ddd6fe">4. Verify &amp; Review Loop</text>

  <rect x="730" y="346" width="210" height="62" rx="14" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
  <text x="835" y="374" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#cffafe">Promote to Workspace</text>
  <text x="835" y="394" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#cffafe">Clean repo until approved</text>

  <!-- Arrows -->
  <line x1="270" y1="120" x2="340" y2="120" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="410" y1="156" x2="155" y2="206" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="156" x2="375" y2="206" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="156" x2="595" y2="206" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="155" y1="282" x2="155" y2="318" stroke="#94a3b8" stroke-width="2"/>
  <line x1="375" y1="282" x2="375" y2="318" stroke="#94a3b8" stroke-width="2"/>
  <line x1="595" y1="282" x2="595" y2="318" stroke="#94a3b8" stroke-width="2"/>
  <line x1="155" y1="318" x2="695" y2="318" stroke="#94a3b8" stroke-width="2"/>
  <line x1="695" y1="318" x2="695" y2="215" stroke="#94a3b8" stroke-width="2"/>
  <line x1="695" y1="215" x2="730" y2="215" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="835" y1="300" x2="835" y2="346" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
